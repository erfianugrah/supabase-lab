# A full recursive resolver (no "." forwarder), so a CNAME chain is followed
# by THIS resolver rather than by an upstream recursor. A zone forward for
# supabase.co. is added at run time with unbound-control (see HP07); that
# forward applies to CNAME targets too, which is the point.
server:
  interface: 0.0.0.0
  access-control: 0.0.0.0/0 allow
  do-not-query-localhost: no
  do-ip6: no
  verbosity: 1
  use-syslog: no
  cache-max-ttl: 3600
  prefetch: no
  serve-expired: no

remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-use-cert: no
