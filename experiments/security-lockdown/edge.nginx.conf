# S20 edge: the trust boundary for a db-pre-request IP filter. nginx OVERWRITES
# X-Forwarded-For with the peer address it saw, so PostgREST's pre-request
# function sees the edge's view of the client, not a client-supplied header.
# Only meaningful if PostgREST is reachable from nowhere but this edge.
events {}
http {
  server {
    listen 8081;
    location / {
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_pass http://host.docker.internal:3001;
    }
  }
}
