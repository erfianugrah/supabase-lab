# S05 rate limiter: nginx limit_req in front of the self-hosted PostgREST.
# The "many things" that can rate-limit (Worker / WAF / nginx / Upstash) are
# interchangeable here; nginx is the self-contained one. Only effective
# because it sits in front of a CLOSED origin (managed Data API off, S04).
events {}
http {
  limit_req_zone $binary_remote_addr zone=rl:10m rate=2r/s;
  limit_req_status 429;
  server {
    listen 8080;
    location / {
      limit_req zone=rl burst=2 nodelay;
      proxy_pass http://host.docker.internal:3001;
    }
  }
}
